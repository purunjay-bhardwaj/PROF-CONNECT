{% extends 'base.html' %}{% block content %}<section class="card"><a href="{{ url_for('kiosk',slug=professor.slug) }}">← Office display</a><h1>Book with {{ professor.name }}</h1><p>{{ professor.department }} · {{ professor.office }}</p><form method="get" class="date-form"><label>Date <input type="date" name="date" value="{{ selected_day.isoformat() }}" min="{{ today if today else '' }}"></label><button>Show slots</button></form><form method="post"><input type="hidden" name="date" value="{{ selected_day.isoformat() }}"><label>Full name<input name="student_name" required></label><label>College email<input type="email" name="student_email" required></label><label>Student ID<input name="student_id" required></label><label>Purpose<textarea name="purpose" required maxlength="300"></textarea></label><label>Available time<select name="starts_at" required><option value="">Choose a slot</option>{% for slot in slots %}<option value="{{ slot.isoformat() }}">{{ slot.strftime('%a, %d %b · %I:%M %p') }}</option>{% endfor %}</select></label>{% if not slots %}<p class="flash error">No available slots for this date. Choose another date.</p>{% endif %}<button class="button" {% if not slots %}disabled{% endif %}>Confirm appointment</button></form></section>{% endblock %}
