# Run: docker compose -f compose.yaml -f compose.production.yaml up -d --build
services:
  gather:
    environment:
      # The app port is loopback-only; requests come through trusted Caddy.
      FORWARDED_ALLOW_IPS: "*"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gather
volumes:
  caddy-data:
  caddy-config:
